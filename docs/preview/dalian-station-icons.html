  h2{font-size:15px;margin:30px 0 12px;border-left:4px solid #0031A8;padding-left:9px}
  .card{background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 1px 4px rgba(0,0,0,.09);display:inline-block;margin:0 12px 12px 0;text-align:center;vertical-align:top}

  .zoom figcaption{font-size:11px;color:#777;margin-top:10px}
  .dark{background:#1a1a1a;--map-bg:#1a1a1a;--text-color:#e5e8ea;--station-stroke:#bdcbd2;padding:18px;border-radius:10px;margin-top:14px}
  .dark .card{background:#232323;box-shadow:none}
  .dark .card figcaption{color:#aaa}
  .dark h2{color:#eee}
  table{border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.09)}
  th,td{padding:10px 16px;font-size:13px;text-align:left;border-bottom:1px solid #eceff1}
  th{background:#f6f7f8;font-weight:600}
  code{background:#f0f2f4;padding:1px 5px;border-radius:4px;font-size:12px}
