<!--
  福州 - 国铁车站标记 (city/fuzhou/assets/fuzhou_railway.svg)

  用于水域层（data_scattered.js 的 SCATTERED_DATA）在国铁枢纽站点处标注铁路徽标：
  福州火车站（M104）、福州火车南站（M121）。图形取自 CGoUI 的内置 railway 图标，
  外套一枚白色圆角底板，保证压在水域蓝线与线网之上仍然清晰。

  以 <img> 方式加载（renderScatteredObjects），处于独立文档、拿不到页面 CSS 变量，
  故颜色在此硬编码 —— 与同目录 fuzhou_sea.svg 的做法一致。
-->
