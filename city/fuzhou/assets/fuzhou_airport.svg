<?xml version="1.0" encoding="UTF-8"?>
<!--
  福州 - 机场标记 (city/fuzhou/assets/fuzhou_airport.svg)

  用于水域层（data_scattered.js 的 SCATTERED_DATA）在长乐国际机场站点处标注航空徽标：
  滨海快线 机场站（M614）。图形取自 CGoUI 的内置 plane 图标，
  外套一枚白色圆角底板，保证压在水域蓝线与线网之上仍然清晰。

  以 <img> 方式加载（renderScatteredObjects），处于独立文档、拿不到页面 CSS 变量，
  故颜色在此硬编码 —— 与同目录 fuzhou_sea.svg 的做法一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
    <rect x="0.6" y="0.6" width="22.8" height="22.8" rx="4.6" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="0.6" y="0.6" width="22.8" height="22.8" rx="4.6" fill="none" stroke="#0B6FA4" stroke-width="1.2"/>
    <!-- 飞机剪影 -->
    <path fill="#0B6FA4" d="M12 2.6c-.75 0-1.35.6-1.35 1.35v4.15L4.4 11.4c-.3.17-.5.5-.5.86v1.1c0 .28.26.48.53.4l6.22-1.9v4.2l-1.85 1.4c-.16.12-.25.3-.25.5v.95c0 .25.23.43.47.36l2.98-.9 2.98.9c.24.07.47-.11.47-.36v-.95c0-.2-.09-.38-.25-.5l-1.85-1.4v-4.2l6.22 1.9c.27.08.53-.12.53-.4v-1.1c0-.36-.2-.69-.5-.86l-6.25-3.3V3.95c0-.75-.6-1.35-1.35-1.35Z"/>
</svg>
