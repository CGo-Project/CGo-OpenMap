<!DOCTYPE html>
<html lang="zh-CN" glass-mode="liquid" header-mode="floating">

<head>
    <script>
        (function () {
            var t = localStorage.getItem('app-theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var hm = localStorage.getItem('root_cgo_header_mode') || localStorage.getItem('cgo_header_mode');
            if (hm) document.documentElement.setAttribute('header-mode', hm);
            var gm = localStorage.getItem('cgo_glass_mode');
            if (gm) document.documentElement.setAttribute('glass-mode', gm);
            // 从邻城切换过来时先隐藏地图，由 core/city-neighbors.js 对齐视口后再淡入
            if (/[?&]nbfrom=/.test(location.search)) document.documentElement.classList.add('nb-arrive');
        })();
    </script>
    <!-- ========================================================================== -->
    <!-- 1. 基础元数据与 SEO 配置 (Metadata & SEO Settings)                          -->
    <!-- 移植说明：制作新城市时，可在 city/data.js 中配置城市标题与描述，也会动态更新此处 -->
    <!-- ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="CGo OpenMap 是一款现代轻量、高度可扩展的开源城市轨道交通交互线路图引擎，支持快速制作和部署各城市地铁线路图。">
    <meta name="keywords" content="CGo OpenMap, 线路图开放平台, 开源地铁图, 城市轨道交通, 地铁线路图, 轨道交通">
    <meta name="author" content="Central Go">
    <meta property="og:title" content="CGo OpenMap - 城市轨道交通线路图开放平台">
    <meta property="og:description" content="轻量、现代化的开源城市轨道交通交互线路图引擎，支持自由定制与移植制作各城市线路图。">
    <meta property="og:image" content="./assets/icons/mapicon.png">

    <!-- 字体引入 (Web Fonts) -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link
        href="https://fonts.loli.net/css2?family=Arimo:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">
    <link rel="apple-touch-icon" href="./assets/icons/mapicon2.png">

    <title>CGo OpenMap - 城市轨道交通线路图开放平台</title>

    <!-- ========================================================================== -->
    <!-- 2. 样式表加载 (Stylesheets)                                                 -->
    <!-- cgo_clr.css: 基础主题色与各线路标志色 CSS 变量                                -->
    <!-- cgo_element.css / cgo_ui.css / cgo_components.css: CGoUI 基础组件库样式表     -->
    <!-- style.css: 地图引擎核心样式、图层布局、动画与手势响应                          -->
    <!-- ========================================================================== -->
    <!-- CGoUI 核心 JS 模块预编译与最高优先级预加载 -->
    <link rel="modulepreload" href="core/cgo-ui.js?v=261008.220300">
    <link rel="stylesheet" href="css/cgo_clr.css?v=261008.220300">
    <link rel="stylesheet" href="css/cgo_element.css?v=261008.220300">
    <link rel="stylesheet" href="css/cgo_ui.css?v=261008.220300">
    <link rel="stylesheet" href="css/cgo_components.css?v=261008.220300">
    <link rel="stylesheet" href="css/style.css?v=261008.220300">
    <style>
        /* Web Components 自定义元素未注册前的占位与防无样式闪烁 (FOUC) */
        cgo-icon:not(:defined) {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            visibility: visible;
            opacity: 0.6;
        }

        .title-short {
            display: none;
        }

        .title-full {
            display: inline;
        }

        @media (max-width: 640px) {
            .title-full {
                display: none;
            }

            .title-short {
                display: inline;
            }
        }

        /* 浮动标题栏模式下，地图缩放控件避让顶部悬浮双岛栏（桌面端加大间距） */
        :root[header-mode="floating"] #modern-zoom-control,
        body[header-mode="floating"] #modern-zoom-control {
            top: calc(env(safe-area-inset-top, 0px) + 96px);
        }

        /* 移动端 (<=640px)：缩放控件左侧与标题栏左岛左边缘对齐 */
        @media (max-width: 640px) {

            :root[header-mode="floating"] #modern-zoom-control,
            body[header-mode="floating"] #modern-zoom-control {
                top: calc(env(safe-area-inset-top, 0px) + 76px);
                left: calc(10px + env(safe-area-inset-left, 0px));
            }
        }

        /* 侧栏（检索与线路列表）**展开时**：缩放控件让到顶部双岛之间那片空白去 ——
           那儿本来就是全透明的，控件停在那儿既不遮双岛、也不压侧栏；上边缘与双岛齐平。
           判据必须用 #legend-overlay.is-open（core 开合时挂的类），不能用 :has(.legend-modal)：
           .legend-modal 是常驻 DOM 节点（收起时只是遮罩 display:none），:has() 只看节点存在性，
           那样写会在收起态也命中、把默认位置一并改掉。
           只在桌面端这么做：移动端顶部是单胶囊，中间未必留得出空位。
           注：桌面「固定侧栏」(body.legend-pinned) 是另一套常驻布局，暂不在本规则内。 */
        @media (min-width: 641px) {

            :root[header-mode="floating"] body:has(#legend-overlay.is-open) #modern-zoom-control,
            body[header-mode="floating"]:has(#legend-overlay.is-open) #modern-zoom-control {
                top: calc(env(safe-area-inset-top, 0px) + 20px);
                left: 50%;
                transform: translateX(-50%);
            }
        }

        /* 液态玻璃模式下的地图控件微质感增强 (Tier C 强调表面规范) */
        :root[glass-mode="liquid"] #modern-zoom-control,
        body[glass-mode="liquid"] #modern-zoom-control {
            background-color: var(--glass-bg-surface, rgba(255, 255, 255, 0.72)) !important;
            backdrop-filter: var(--glass-backdrop-blur-surface, blur(14px) saturate(135%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur-surface, blur(14px) saturate(135%));
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
        }

        [data-theme="dark"]:root[glass-mode="liquid"] #modern-zoom-control,
        [data-theme="dark"] body[glass-mode="liquid"] #modern-zoom-control {
            background-color: var(--glass-bg-surface, rgba(31, 32, 34, 0.72)) !important;
            box-shadow: var(--glass-shadow);
        }
    </style>
</head>

<body>
    <!-- 键盘跳转链接：检索与线路列表都在图例面板内，由 core/script.js 负责展开面板并落焦 -->

    <h1 class="sr-only" id="page-heading">CGo OpenMap 城市轨道交通线路图</h1>

        <div class="header-island header-island-left glass-surface">

                <a href="./index.html" class="btn btn-primary" title="返回城市列表">

            </div>
            <div class="header-island-divider" aria-hidden="true"></div>
            <div class="header-center">

                    <img src="./assets/icons/mapicon.png" alt="" class="header-logo" loading="lazy" decoding="async"
                        fetchpriority="low"
                        onload="this.classList.add('loaded');this.parentElement&&this.parentElement.classList.add('loaded');">
                    <cgo-icon name="sparkle" class="icon-placeholder"></cgo-icon>
                </div>
                <span class="app-title">
                    <span class="title-full">北京 开放地图</span>

                <script>
                    (function () {
                        try {
                            var p = new URLSearchParams(window.location.search);
                            var cid = p.get('city') || localStorage.getItem('cgo_openmap_city');
                            var names = {
                                beijing: "北京", shanghai: "上海", guangzhou: "广州", shenzhen: "深圳",
                                chengdu: "成都", wuhan: "武汉", nanjing: "南京", chongqing: "重庆",
                                hangzhou: "杭州", shenyang: "沈阳", dalian: "大连", changchun: "长春",
                                harbin: "哈尔滨", lanzhou: "兰州", hefei: "合肥", qingdao: "青岛",
                                hongkong: "香港", fuzhou: "福州", sydney: "悉尼", hohhot: "呼和浩特"
                            };
                            if (cid && names[cid]) {
                                var el = document.querySelector('.title-full');
                                if (el) el.textContent = names[cid] + ' 开放地图';
                            }

            </div>
        </div>

        <div class="header-island header-island-right glass-surface">
            <div class="header-right">
                <!-- 更多：选项下拉菜单 -->
                <div class="dropdown options-dropdown">
                    <button id="options-btn" class="btn btn-info dropbtn" title="更多" aria-haspopup="true" aria-expanded="false">
                        <cgo-icon name="menu"></cgo-icon>
                        <span>更多</span>
                    </button>
                    <div class="dropdown-content">
                        <!-- 偏好设置 (弹窗逻辑由 core/settings.js 驱动) -->
                        <a href="javascript:void(0)" id="settings-btn">
                            <cgo-icon name="settings"></cgo-icon>
                            <span>偏好设置</span>
                        </a>
                        <!-- 帮助与关于 (弹窗逻辑由 core/help.js 驱动) -->
                        <a href="javascript:void(0)" id="help-btn">
                            <cgo-icon name="help"></cgo-icon>
                            <span>帮助与关于</span>
                        </a>
                        <!-- 社区贡献与主理人 (指向 CONTRIBUTING.md) -->

    <!-- ========================================================================== -->
    <!-- 4. 地图主视口与交互层 (Map Viewport & Layer Hierarchy)                        -->
    <!-- 层级自底向上：                                                               -->
    <!--   1. scattered-layer: 背景装饰物（如指南针、城门、河流图标等）                  -->
    <!--   2. lines-layer: SVG 矢量线路层（绘制圆角折线）                              -->
    <!--   3. not-open-layer: 在建/规划虚线层                                         -->
    <!--   4. highlight-layer: 选线高亮发光层                                        -->
    <!--   5. stations-layer: 车站圆点/换乘标记点 (Station Nodes)                      -->
    <!--   6. labels-layer: 车站中英文名称标签 (Station Labels)                       -->
    <!-- ========================================================================== -->
    <main id="main-content" style="position: relative; flex: 1; overflow: hidden; width: 100%;">
        <!-- 现代化浮动控制条：检索入口、缩放滑块、LBS 查找最近车站 -->
        <div id="modern-zoom-control" role="group" aria-label="地图控件">
            <button id="mz-menu" title="检索面板" aria-label="打开搜索与线路列表" style="margin-bottom: 8px;">
                <cgo-icon name="view-grid" style="width:20px;height:20px;"></cgo-icon>
            </button>
            <button id="mz-in" title="放大" aria-label="放大"><cgo-icon name="zoom-in"></cgo-icon></button>
            <div class="mz-slider-track">
                <input type="range" id="mz-slider" min="0.5" max="3.0" step="0.1" value="1.0" aria-label="缩放比例">
            </div>
            <button id="mz-out" title="缩小" aria-label="缩小"><cgo-icon name="zoom-out"></cgo-icon></button>
            <div style="width: 20px; height: 1px; background-color: #e0e0e0; margin: 4px 0;" aria-hidden="true"></div>
            <button id="locate-btn" title="查找最近车站" aria-label="查找最近车站">
                <cgo-icon name="location" size="20"></cgo-icon>
            </button>
        </div>

        <!-- 全屏时顶部颜色填充层（跟随 panel-header 颜色，信号栏区域背景补色） -->
        <div class="mobile-top-bar-backdrop"></div>
        <!-- 车站详情信息卡片面板 (由 core/script.js 与 city/beijing/stacard 动态填充) -->
        <div id="info-panel" role="region" aria-label="车站信息" style="display:none;"></div>

        <!-- 鼠标悬停线路显示的气泡徽标提示 -->
        <div id="line-tooltip" aria-hidden="true">
            <img id="line-tooltip-img" src="" alt="">
        </div>

        <!-- 地图平移缩放主容器 -->
        <!-- role="application"：方向键 / WASD 平移、+ - 缩放由引擎接管；车站的键盘入口是搜索与线路列表 -->
        <div id="map-container" role="application" tabindex="0"
            aria-label="轨道交通线路图。方向键平移，加号减号缩放；选择车站请使用搜索或线路列表">
            <div id="map-content">
                <div id="scattered-layer" aria-hidden="true"></div>
                <svg id="lines-layer" aria-hidden="true"></svg>
                <svg id="not-open-layer" aria-hidden="true"></svg>
                <svg id="highlight-layer" aria-hidden="true"></svg>
                <div id="stations-layer"></div>
                <div id="labels-layer"></div>
            </div>
        </div>

        <!-- 拖拽面板吸附侧边栏时的辅助幽灵阴影 -->
        <div id="drag-ghost"></div>
    </main>

    <!-- ========================================================================== -->
    <!-- 5. 图例与检索抽屉面板 (Legend & Search Drawer Modal)                        -->
    <!-- 默认浮层弹出；点击固定按钮后可变为桌面端常驻侧边栏                            -->
    <!-- ========================================================================== -->
    <div id="legend-overlay">
        <div class="legend-modal" role="region" aria-label="搜索与线路列表">
            <button class="legend-close-btn" title="收起面板" aria-label="收起面板">
                <span class="btn-content"><cgo-icon name="arrow-right" class="arrow-icon"

            <button class="legend-pin-btn" id="legend-pin-btn" title="固定面板" aria-label="固定面板" aria-pressed="false">

            <div id="legend-content"></div>

    <!-- ========================================================================== -->
    <!-- 6. 业务脚本加载链 (Script Execution Order)                                  -->
    <!-- 【移植重点】：                                                              -->
    <!-- 1. 多城市注册总线 (city/data.js) 必须最先加载                                 -->
    <!-- 2. 目标城市数据文件 (city/{city_id}/*) 依次加载                               -->
    <!--    - {city}.js: 城市业务逻辑与关系配置                                       -->
    <!--    - stacard/script.js: 车站卡片系统与地图切片引擎 (StaCard API)              -->
    <!--    - data_stations.js: 车站坐标与名称                                         -->
    <!--    - data_lines.js: 线路串联与折线点                                          -->
    <!--    - data_virtual_transfers.js: 虚拟/站外换乘关系                             -->
    <!--    - data_scattered.js: 地图装饰物                                            -->
    <!--    - data_legend.js: 图例分组配置                                             -->
    <!--    - data_timetable.js: 首末班车时刻                                         -->
    <!--    - data_notopen.js: 在建线路虚线                                            -->
    <!-- 3. 核心引擎 (core/script.js) 读取上述数据并统一渲染                           -->
    <!-- 4. UI 模块 (core/help.js, core/settings.js, core/notice.js, core/cgo-ui.js?v=261008.220300) -->
    <!-- ========================================================================== -->
    <!-- 折线倒角几何算法 (引擎与 Drunk 编辑模式共用，必须早于 core/script.js) -->
    <script src="core/path-geometry.js?v=261008.220300"></script>
    <!-- 车站图元模板与尺寸 (引擎与 Drunk 编辑模式共用，必须早于 core/script.js) -->
    <script src="core/station-icons.js?v=261008.220300"></script>
    <!-- 无障碍与文本转义公共工具 (须早于 core/station-board.js 与 core/script.js) -->
    <script src="core/a11y.js?v=261008.220300"></script>
    <!-- 城市注册总线与基础元数据 -->
    <script src="city/data.js?v=261008.220300"></script>
    <!-- 车站信息板模块注册与渲染引擎 (多城市通用) -->
    <script src="core/station-board.js?v=261008.220300"></script>
    <!-- 动态按序加载当前激活城市的专属业务与全套数据文件 (根据 URL ?city= 或 LocalStorage 判定) -->
    <script>
        (function () {
            var city = window.CityDataManager ? window.CityDataManager.getCurrentCity() : null;
            var folder = (city && city.folder) ? city.folder : "./city/beijing";
            var cityId = (city && city.id) ? city.id : "beijing";
            var v = "261010.1212";
            // 供城市脚本追加同版本号（如 city/<id>/style.css），避免样式表被浏览器长期缓存
            window.CGO_ASSET_VERSION = v;

            var titleFull = document.querySelector('.title-full');
            if (titleFull && city && city.name) {
                titleFull.textContent = city.name + ' 开放地图';
            }
            // 页面语言随城市切换（注册表可选字段 lang，缺省 zh-CN），读屏据此选择发音
            document.documentElement.lang = (city && city.lang) ? city.lang : 'zh-CN';
            var pageHeading = document.getElementById('page-heading');
            if (pageHeading && city && city.name) {
                pageHeading.textContent = 'CGo OpenMap ' + city.name + '轨道交通线路图';
            }

            // 同步写入当前激活城市的脚本依赖，确保在核心引擎执行前完成加载
            // 注：城市专属自定义模块 (如 modules/beijing_cultural.js) 由各城市 {city}.js 内部
            //     通过 document.write 同步加载，确保早于 type=module 的 core/script.js 执行。
            document.write('<script src="' + folder + '/' + cityId + '.js?v=' + v + '"><\/script>');
            document.write('<script type="module" src="' + folder + '/stacard/script.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_stations.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_lines.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_virtual_transfers.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_scattered.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_legend.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_timetable.js?v=' + v + '"><\/script>');
            document.write('<script src="' + folder + '/data_notopen.js?v=' + v + '"><\/script>');
        })();
    </script>
    <!-- 核心地图渲染引擎 -->
    <script type="module" src="core/script.js?v=261008.220300"></script>
    <!-- 邻城衔接（影子、上拉进入与双城并看；仅对声明了 neighbors 的城市生效，须晚于 core/script.js） -->
    <script type="module" src="core/city-neighbors.js?v=261008.220300"></script>
    <!-- 辅助面板逻辑 -->
    <script src="core/help.js?v=261008.220300"></script>
    <script src="core/settings.js?v=261008.220300"></script>
    <script>
        // 动态加载公告与运营通知系统
        // 版本号与其余资源同批：公告内容更新时随批次串一起升级，不再用时间戳绕过缓存
        // （时间戳会让 Service Worker 每次访问都写入一条新的缓存条目）
        (function () {
            var script = document.createElement('script');
            script.src = "core/notice.js?v=261008.220300";
            document.body.appendChild(script);
        })();
    </script>
    <!-- CGoUI Web Components 基础组件库 -->
    <script type="module" src="core/cgo-ui.js?v=261008.220300"></script>
    <script>
        // 图片加载完毕后添加 loaded 类，配合 CSS 实现平滑淡入
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.img-icon-wrapper img').forEach(function (img) {
                if (img.complete && img.naturalWidth !== 0) {
                    img.classList.add('loaded');
                    if (img.parentElement) img.parentElement.classList.add('loaded');
                }
            });
        });

        // 注册 PWA 渐进式应用 Service Worker，提供离线访问与切片缓存
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js')
                    .then(function (reg) {
                        reg.update().catch(function () { });
                        console.log('[SW] Service Worker 注册成功，作用域:', reg.scope);
                    })
                    .catch(function (err) {
                        console.warn('[SW] Service Worker 注册失败:', err);
                    });
            });
        }
    </script>
</body>

</html>
