name: CI - CGo OpenMap 质量与版本门禁自检

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 质量与全套自动化回归自检
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. 预缓存资源与全站版本号一致性校验 (check-cache-assets)
        run: node scripts/check-cache-assets.mjs

      - name: 2. 全网城市拓扑、对齐与几何算法回归自检 (selfcheck)
        run: node editor/tests/selfcheck.js

      - name: 3. 福州与苏州城市专属数据与契约自检
        run: |
          node city/fuzhou/tools/fuzhou_check.js
          node city/fuzhou/tools/fuzhou_network_check.js
          node city/fuzhou/tools/fuzhou_viewer_check.js
          node city/suzhou/tools/suzhou_check.js
